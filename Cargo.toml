[package]
name = "event-timer"
version = "1.5.2"
edition = "2021"
description = "Event Timer – Countdown, Redezeit und Ablaufplan für Bühne und Regie"
license = "GPL-3.0-or-later"
authors = ["Felix Spindler <f-spindler@pm.me>"]
build = "build.rs"

# Bewusst ohne Abhängigkeiten: baut offline, überall, in Sekunden.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
