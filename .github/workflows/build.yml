# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo test --locked
      - run: node tools/test-engine.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: macos-latest, target: universal, name: macos }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, name: linux-arm64 }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, name: linux-armv7 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Version
        shell: bash
        run: echo "V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Windows (.exe with icon, no console window)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p out && cp target/${{ matrix.target }}/release/event-timer.exe "out/event-timer-$V-windows-x64.exe"

      - name: "macOS (Event Timer.app, universal: Apple Silicon + Intel)"
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          APP="Event Timer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" out
          lipo -create -output "$APP/Contents/MacOS/event-timer" \
            target/aarch64-apple-darwin/release/event-timer target/x86_64-apple-darwin/release/event-timer
          cp packaging/icon/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed "s/__VERSION__/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # ad-hoc signature: unsigned bundles are reported as "damaged" on Apple Silicon
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "out/event-timer-$V-macos.zip"

      - name: Linux (static, via zig; with icon and menu entry)
        if: runner.os == 'Linux'
        run: |
          pip3 install --break-system-packages cargo-zigbuild
          rustup target add ${{ matrix.target }}
          cargo zigbuild --release --locked --target ${{ matrix.target }}
          D="event-timer-$V-${{ matrix.name }}"
          mkdir -p "$D" out
          cp target/${{ matrix.target }}/release/event-timer packaging/icon/event-timer.png packaging/linux/install-desktop.sh LICENSE "$D/"
          tar -czf "out/$D.tar.gz" "$D"

      - uses: actions/upload-artifact@v4
        with:
          name: event-timer-${{ env.V }}-${{ matrix.name }}
          path: out/*

  standalone:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "V=$V" >> "$GITHUB_ENV"
          node tools/build-standalone.js
          mkdir -p out && cp dist/event-timer-standalone.html "out/event-timer-$V-standalone.html"
      - uses: actions/upload-artifact@v4
        with:
          name: event-timer-${{ env.V }}-standalone
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" 'index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          echo "PRE=$([[ "$V" == *-* ]] && echo true || echo false)" >> "$GITHUB_ENV"
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ env.PRE }}
